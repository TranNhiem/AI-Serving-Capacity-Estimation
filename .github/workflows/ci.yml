name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,run]"
      - name: Unit tests
        run: pytest -q
      - name: the auditable modules must import with no third-party deps
        # Nine promises, one mechanism. `capacity` is the formula set: if it grows a
        # dependency, anyone wanting to check the maths has to adopt our stack first.
        # `bench.records` is the published record format, `bench.metrics` is the reduction
        # applied to it and `bench.ladder` the grading applied to that, so re-deriving
        # someone else's percentiles and re-grading their rungs from their own records --
        # the two most useful things a sceptical reader can do -- must not require our HTTP
        # client either.
        # `bench.driver` is the harness that produced the records, so a reader who doubts a
        # boundary ruling can re-run `apply_boundary_rules` over the bundle and see whether
        # they get the same cohorts -- which is only a check if it needs nothing installed.
        # `bench.workloads` turns a published manifest back into the exact prompt sequence a
        # run issued, which is the strongest reproduction check the protocol has: it lets a
        # reader confirm the workload was what the report says before arguing about the
        # numbers measured on it. Making that require our HTTP client would put the check
        # behind an install for everyone whose objection is that they do not trust our stack.
        # `bench.persist` writes the bundle and, more to the point, re-checks one: verifying a
        # downloaded archive against its own digests is the first thing a reader does and the
        # only one they can do before trusting anything inside it. A verifier you have to
        # install the publisher's stack to run is not independent verification.
        # `bench.adapters.base` is the contract a third party implements to support their own
        # framework, so it must be readable and subclassable without installing ours -- which
        # also pins the package initialiser, since one eager re-export of the concrete
        # adapter would pull httpx in behind it and break the promise from a file that never
        # mentions it.
        # `bench.run` assembles the report from the summaries, so it is where a reader goes
        # to answer "which repetition is this row, and where did its token counts come from".
        # It takes its adapter as an argument precisely so that reading it needs nothing
        # installed; the check is what stops a later top-level `import httpx` from quietly
        # putting `ascep bench --dry-run` behind the transport extra.
        # Third-party means "came out of site-packages", not "absent from
        # sys.stdlib_module_names": that attribute is 3.10+ and this job runs on the
        # 3.9 leg of the matrix too, where it raised AttributeError and failed the
        # build for a reason that had nothing to do with the dependency being checked.
        run: |
          python - <<'EOF'
          import subprocess, sys, textwrap
          code = textwrap.dedent("""
              import os, sys, sysconfig
              target = sys.argv[1]
              before = set(sys.modules)
              __import__(target)
              paths = sysconfig.get_paths()
              sitedirs = tuple(os.path.realpath(p) + os.sep
                               for p in {paths.get('purelib'), paths.get('platlib')} if p)
              def installed(name):
                  f = getattr(sys.modules.get(name), '__file__', None)
                  return bool(f) and os.path.realpath(f).startswith(sitedirs)
              extra = {m.split('.')[0] for m in set(sys.modules) - before
                       if installed(m) and not m.startswith(('ascep', '_'))}
              assert not extra, f"{target} pulled in non-stdlib modules: {sorted(extra)}"
              print(f"{target} is stdlib-only")
          """)
          targets = (
              "ascep.capacity",
              "ascep.bench.records",
              "ascep.bench.metrics",
              "ascep.bench.ladder",
              "ascep.bench.driver",
              "ascep.bench.workloads",
              "ascep.bench.persist",
              "ascep.bench.adapters.base",
              "ascep.bench.run",
          )
          for target in targets:
              rc = subprocess.run([sys.executable, "-c", code, target]).returncode
              if rc:
                  sys.exit(rc)
          EOF

  bare-install:
    name: everything but validate works with no optional extras
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # Deliberately NOT ".[run]". tests/test_cli.py asserts these commands import nothing
      # outside the stdlib, but it runs where jsonschema happens to be installed, so it can
      # only catch an eager import — not a lazy one that would still fail here. The users who
      # most need `ascep size` are on locked-down benchmark clusters where adding a dependency
      # is a ticket, so this is the install that has to work.
      - run: pip install -e .
      - run: ascep version
      # `init` is the first command a new contributor runs. If it needed the extras, the
      # protocol would be unreachable from exactly the locked-down clusters it targets.
      - run: |
          ascep init --layer hardware > /tmp/hw.json
          python -c "import json; json.load(open('/tmp/hw.json'))"
      - run: |
          ascep size --workload examples/chatbot-10k-dau/workload.json \
                     --kv-tokens 574798 --throughput-tok-s 1459 --gpus-per-replica 2
      - run: ascep conformance examples/moe-26b-h100-tp2/report.json
      - run: ascep render examples/moe-26b-h100-tp2/report.json -o /dev/null
      # And the commands that DO need the extras must say so instead of tracebacking.
      - name: validate without extras explains itself
        run: |
          set +e
          out=$(ascep validate examples/moe-26b-h100-tp2/report.json 2>&1); rc=$?
          set -e
          echo "$out"
          [ "$rc" = "2" ] || { echo "expected exit 2, got $rc"; exit 1; }
          echo "$out" | grep -q "pip install" || { echo "no install hint"; exit 1; }

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  schemas:
    name: schemas are valid and self-consistent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev,run]"
      - run: pytest -q tests/test_schemas.py

  examples:
    name: published examples still reproduce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev,run]"
      # Every (I) number in every example must recompute from its (M) numbers.
      # This is conformance rule C2 enforced in CI.
      - run: |
          pytest -q tests/test_example_reproduces.py tests/test_report_conformance.py \
                    tests/test_application_sizing.py
      # A committed artifact that its own builder no longer produces has been hand-edited.
      - name: published artifacts are regenerable
        run: |
          for b in examples/*/build_*.py; do python "$b"; done
          git diff --exit-code -- examples/

  wheel:
    name: a real wheel works outside the source tree
    runs-on: ubuntu-latest
    # Every other job installs with `pip install -e .`, which leaves the checkout in place and
    # therefore cannot see a packaging bug: the schemas live at the repository root, so for one
    # release they were absent from the wheel entirely and `ascep validate` raised
    # FileNotFoundError for anyone who installed normally. This job installs the built artifact
    # into a clean environment and runs it from a directory that contains no ASCEP source.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install build && python -m build --wheel
      - name: the wheel actually contains the schemas
        run: |
          python - <<'EOF'
          import glob, zipfile
          names = zipfile.ZipFile(sorted(glob.glob("dist/*.whl"))[-1]).namelist()
          shipped = sorted(n for n in names if n.endswith(".schema.json"))
          print("\n".join(shipped) or "(none)")
          assert len(shipped) == 6, f"expected 6 schemas in the wheel, found {len(shipped)}"
          EOF
      - name: install it clean and run from elsewhere
        run: |
          python -m venv /tmp/wenv
          /tmp/wenv/bin/pip install "$(ls dist/*.whl)" jsonschema
          mkdir -p /tmp/away && cp examples/moe-26b-h100-tp2/report.json /tmp/away/
          cd /tmp/away
          /tmp/wenv/bin/ascep version
          /tmp/wenv/bin/ascep validate report.json
          /tmp/wenv/bin/ascep conformance report.json

  no-secrets:
    name: no credentials, hostnames or pricing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # Generic patterns only in CI — the site-specific .ascep-denylist is intentionally
      # not committed, so contributors must also run this locally before opening a PR.
      - run: python tools/check_no_secrets.py
